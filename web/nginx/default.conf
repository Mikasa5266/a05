    return 301 https://$host$request_uri;
}

# 2. 木木点餐的 HTTPS 配置
server {
    listen 443 ssl;
    server_name mumu.aiinterview2244.xyz; 

    # 【这里改了！】路径必须对应 docker-compose 的右半部分
    ssl_certificate      /etc/nginx/ssl/mumu.crt; 
    ssl_certificate_key  /etc/nginx/ssl/mumu.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    location / {
        # 【建议改这里】用公网 IP 或者 docker0 的网关 IP
        proxy_pass http://134.175.183.115:8888; 
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        client_max_body_size 20m;
    }
}
