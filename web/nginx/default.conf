# 1. HTTP 自动跳转到 HTTPS
server {
    listen 80;
    server_name aiinterview2244.xyz; # 建议换成你的域名，如果还没解析好就写 _

    # 强制跳转到 HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS 配置
server {
    listen 443 ssl;
    server_name aiinterview2244.xyz; # 建议换成你的域名

    # 证书路径（必须和 docker-compose 冒号右边的路径一模一样！）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL 优化设置（推荐）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 3D 模型强缓存，降低 ngrok 下重复加载开销
    location ~* \.(glb|gltf|bin)$ {
        expires 45d;
        add_header Cache-Control "public, max-age=3888000, immutable";
        try_files $uri =404;
    }

    # 前端页面路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 转发
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 管理平台（独立于主程序前端）
    location /admin-platform/ {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 文件上传转发
    location /uploads/ {
        proxy_pass http://backend:8082/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

